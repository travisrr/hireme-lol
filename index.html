<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var key = "workwithme-theme";
          var stored = localStorage.getItem(key);
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <title>workwithme.lol — How high are you willing to go?</title>
    <meta
      name="description"
      content="The professional leaderboard where money talks. Bid for your spot. Get seen. Get outbid. Do it again."
    />
    <link rel="canonical" href="https://workwithme.lol/" />
    <meta property="og:site_name" content="workwithme.lol" />
    <meta property="og:title" content="workwithme.lol" />
    <meta
      property="og:description"
      content="Bid on yourself. Get to #1 on LinkedIn with more work by outbidding others."
    />
    <meta property="og:image" content="https://workwithme.lol/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://workwithme.lol" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics JS beacon. Injected at the edge when CF_WEB_ANALYTICS_TOKEN is set. No GA. -->
  </body>
</html>
